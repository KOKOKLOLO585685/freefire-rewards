{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <h3 class="text-center text-info mb-4">تسجيل الدخول للمتجر</h3>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم:</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور:</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-main w-100 py-2 mt-2">دخول</button>
            </form>
            <p class="mt-3 text-center">ليس لديك حساب؟ <a href="/register" class="text-info">أنشئ حساباً مجانياً</a></p>
        </div>
    </div>
</div>
{% endblock %}
